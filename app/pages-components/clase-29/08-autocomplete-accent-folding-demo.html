<div class="main__demo">

    <div class="autocomplete-accent-folding">

        <h3 class="autocomplete-accent-folding__title">Ignorar acentos</h3>

        <p class="autocomplete-accent-folding__hint">Escribe el nombre sin acento.</p>

        <div class="autocomplete-accent-folding__stage">
            <p class="campo">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" autocomplete="off">
            </p>
        </div>

        <div class="autocomplete-accent-folding__note">
            <p class="autocomplete-accent-folding__note-text">Escribe el nombre sin acento. &lt;code&gt;alvaro&lt;/code&gt; encuentra Álvaro, &lt;code&gt;maria&lt;/code&gt; encuentra María y &lt;code&gt;inigo&lt;/code&gt; encuentra Íñigo.</p>
        </div>

    </div>

</div>

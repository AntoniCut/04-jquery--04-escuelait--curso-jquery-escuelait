<div class="main__demo">

    <div class="selectmenu-rendering">

        <h3 class="selectmenu-rendering__title">Presentación propia</h3>

        <p class="selectmenu-rendering__hint">Cada opción pinta el icono indicado en &lt;code&gt;data-icono&lt;/code&gt; junto al texto.</p>

        <div class="selectmenu-rendering__stage">
            <p class="campo">
            <label for="archivo">Archivo</label>
            <select id="archivo">
            <option data-icono="ui-icon-script">jquery.js</option>
            <option data-icono="ui-icon-image">foto.png</option>
            <option data-icono="ui-icon-video">clip.mp4</option>
            <option data-icono="ui-icon-note" disabled>borrador.txt</option>
            </select>
            </p>
        </div>

        <div class="selectmenu-rendering__note">
            <p class="selectmenu-rendering__note-text">Cada opción pinta el icono indicado en &lt;code&gt;data-icono&lt;/code&gt; junto al texto.</p>
        </div>

    </div>

</div>

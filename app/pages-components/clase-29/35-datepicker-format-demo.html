<div class="main__demo">

    <div class="datepicker-format">

        <h3 class="datepicker-format__title">Formato de fecha</h3>

        <p class="datepicker-format__hint">El mismo día puede mostrarse como &lt;code&gt;dd/mm/aa&lt;/code&gt; o como fecha larga.</p>

        <div class="datepicker-format__stage">
            <p class="campo">
            <label for="corto">Formato corto</label>
            <input id="corto" type="text" autocomplete="off">
            </p>
            <p class="campo">
            <label for="largo">Formato largo</label>
            <input id="largo" type="text" autocomplete="off">
            </p>
        </div>

        <div class="datepicker-format__note">
            <p class="datepicker-format__note-text">El mismo día puede mostrarse como &lt;code&gt;dd/mm/aa&lt;/code&gt; o como fecha larga. El texto entre comillas simples se copia tal cual.</p>
        </div>

    </div>

</div>

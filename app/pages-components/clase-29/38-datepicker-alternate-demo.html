<div class="main__demo">

    <div class="datepicker-alternate">

        <h3 class="datepicker-alternate__title">Campo alternativo</h3>

        <p class="datepicker-alternate__hint">El campo visible usa &lt;code&gt;dd/mm/aa&lt;/code&gt;.</p>

        <div class="datepicker-alternate__stage">
            <p class="campo">
            <label for="visible">Fecha visible</label>
            <input id="visible" type="text" autocomplete="off">
            </p>
            <p class="campo">
            <label for="alterno">Fecha enviada</label>
            <input id="alterno" type="text" readonly>
            </p>
        </div>

        <div class="datepicker-alternate__note">
            <p class="datepicker-alternate__note-text">El campo visible usa &lt;code&gt;dd/mm/aa&lt;/code&gt;. El campo alternativo guarda &lt;code&gt;aa-mm-dd&lt;/code&gt;.</p>
        </div>

    </div>

</div>

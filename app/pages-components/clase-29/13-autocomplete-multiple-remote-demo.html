<div class="main__demo">

    <div class="autocomplete-multiple-remote">

        <h3 class="autocomplete-multiple-remote__title">Varios valores en remoto</h3>

        <p class="autocomplete-multiple-remote__hint">Hacen falta dos letras.</p>

        <div class="autocomplete-multiple-remote__stage">
            <p class="campo">
            <label for="ciudades">Ciudades</label>
            <input id="ciudades" type="text" autocomplete="off">
            </p>
            <p id="estado" class="nota">Escribe una ciudad.</p>
        </div>

        <div class="autocomplete-multiple-remote__note">
            <p class="autocomplete-multiple-remote__note-text">Hacen falta dos letras. Escribe &lt;code&gt;mad&lt;/code&gt;, elige Madrid y, tras la coma, escribe &lt;code&gt;bar&lt;/code&gt; para añadir Barcelona. La lista tarda un momento.</p>
        </div>

    </div>

</div>

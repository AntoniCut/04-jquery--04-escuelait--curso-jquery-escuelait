<div class="main__demo">

    <div class="slider-colorpicker">

        <h3 class="slider-colorpicker__title">Selector de color</h3>

        <p class="slider-colorpicker__hint">Tres deslizadores, de 0 a 255, componen un color RGB.</p>

        <div class="slider-colorpicker__stage">
            <div id="muestra"></div>
            <p class="eje"><label for="rojo">Rojo</label><span id="valor-rojo">255</span></p>
            <div id="rojo"></div>
            <p class="eje"><label for="verde">Verde</label><span id="valor-verde">140</span></p>
            <div id="verde"></div>
            <p class="eje"><label for="azul">Azul</label><span id="valor-azul">60</span></p>
            <div id="azul"></div>
        </div>

        <div class="slider-colorpicker__note">
            <p class="slider-colorpicker__note-text">Tres deslizadores, de 0 a 255, componen un color RGB.</p>
        </div>

    </div>

</div>

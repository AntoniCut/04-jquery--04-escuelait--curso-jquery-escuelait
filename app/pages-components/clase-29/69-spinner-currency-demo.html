<div class="main__demo">

    <div class="spinner-currency">

        <h3 class="spinner-currency__title">Moneda</h3>

        <p class="spinner-currency__hint">El paso es de cinco céntimos.</p>

        <div class="spinner-currency__stage">
            <p class="campo">
            <label for="importe">Importe</label>
            <input id="importe" value="5">
            </p>
            <p id="formato" class="nota">5,00 €</p>
        </div>

        <div class="spinner-currency__note">
            <p class="spinner-currency__note-text">El paso es de cinco céntimos. El importe se muestra en euros junto al campo.</p>
        </div>

    </div>

</div>

<div class="main__demo">

    <div class="progressbar-download">

        <h3 class="progressbar-download__title">Diálogo de descarga</h3>

        <p class="progressbar-download__hint">El botón abre una ventana.</p>

        <div class="progressbar-download__stage">
            <button type="button" id="descargar">Iniciar descarga</button>
            <div id="dialog" title="Descarga">
            <p id="estado">Preparando…</p>
            <div id="progressbar"></div>
            </div>
        </div>

        <div class="progressbar-download__note">
            <p class="progressbar-download__note-text">El botón abre una ventana. La barra permanece en carga un momento y después avanza. Al terminar, el texto indica que la descarga está completa.</p>
        </div>

    </div>

</div>

<div class="main__demo">

    <div class="slider-multiple">

        <h3 class="slider-multiple__title">Varios deslizadores</h3>

        <p class="slider-multiple__hint">Volumen, brillo y zoom son tres deslizadores horizontales.</p>

        <div class="slider-multiple__stage">
            <p class="eje"><label for="volumen">Volumen</label><span id="valor-volumen">60</span></p>
            <div id="volumen"></div>
            <p class="eje"><label for="brillo">Brillo</label><span id="valor-brillo">40</span></p>
            <div id="brillo"></div>
            <p class="eje"><label for="zoom">Zoom</label><span id="valor-zoom">100</span></p>
            <div id="zoom"></div>
            <p class="eje"><span>Ecualizador</span></p>
            <div id="ecualizador" class="ecualizador">
            <span data-valor="88"></span>
            <span data-valor="77"></span>
            <span data-valor="55"></span>
            <span data-valor="33"></span>
            <span data-valor="40"></span>
            <span data-valor="45"></span>
            <span data-valor="70"></span>
            </div>
        </div>

        <div class="slider-multiple__note">
            <p class="slider-multiple__note-text">Volumen, brillo y zoom son tres deslizadores horizontales. El ecualizador usa deslizadores verticales.</p>
        </div>

    </div>

</div>

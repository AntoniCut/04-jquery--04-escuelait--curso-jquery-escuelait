<div class="main__demo">

    <div class="autocomplete-xml">

        <h3 class="autocomplete-xml__title">XML leído una vez</h3>

        <p class="autocomplete-xml__hint">Escribe &lt;code&gt;py&lt;/code&gt; y sale Python.</p>

        <div class="autocomplete-xml__stage">
            <p class="campo">
            <label for="etiquetas">Etiquetas</label>
            <input id="etiquetas" type="text" autocomplete="off">
            </p>
        </div>

        <div class="autocomplete-xml__note">
            <p class="autocomplete-xml__note-text">Escribe &lt;code&gt;py&lt;/code&gt; y sale Python. Con &lt;code&gt;ja&lt;/code&gt; salen Java y JavaScript. Esas etiquetas se leyeron del XML al cargar la página.</p>
        </div>

    </div>

</div>

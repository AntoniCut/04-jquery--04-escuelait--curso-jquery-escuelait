<div class="main__demo">

    <div class="datepicker-default">

        <h3 class="datepicker-default__title">Funcionalidad por defecto</h3>

        <p class="datepicker-default__hint">El foco en el campo abre el calendario.</p>

        <div class="datepicker-default__stage">
            <p class="campo">
            <label for="datepicker">Fecha</label>
            <input id="datepicker" type="text" autocomplete="off">

        <div class="datepicker-default__note">
            <p class="datepicker-default__note-text">El foco en el campo abre el calendario. Elige un día, pulsa fuera o Escape para cerrarlo.</p>
        </div>

    </div>

</div>

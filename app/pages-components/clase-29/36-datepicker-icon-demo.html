<div class="main__demo">

    <div class="datepicker-icon">

        <h3 class="datepicker-icon__title">Icono para abrir</h3>

        <p class="datepicker-icon__hint">Con &lt;code&gt;showOn: "button"&lt;/code&gt; el calendario se abre desde el botón, no al enfocar el campo.</p>

        <div class="datepicker-icon__stage">
            <p class="campo">
            <label for="datepicker">Fecha</label>
            <input id="datepicker" type="text" autocomplete="off">
            </p>
        </div>

        <div class="datepicker-icon__note">
            <p class="datepicker-icon__note-text">Con &lt;code&gt;showOn: "button"&lt;/code&gt; el calendario se abre desde el botón, no al enfocar el campo.</p>
        </div>

    </div>

</div>

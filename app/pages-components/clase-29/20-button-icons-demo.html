<div class="main__demo">

    <div class="button-icons">

        <h3 class="button-icons__title">Iconos</h3>

        <p class="button-icons__hint">&lt;code&gt;icon&lt;/code&gt; elige el icono y &lt;code&gt;iconPosition&lt;/code&gt; lo coloca al inicio, al final o arriba.</p>

        <div class="button-icons__stage">
            <div class="acciones">
            <button type="button" id="reproducir">Reproducir</button>
            <button type="button" id="anterior">Anterior</button>
            <button type="button" id="siguiente">Siguiente</button>
            <button type="button" id="parar">Parar</button>
            </div>
        </div>

        <div class="button-icons__note">
            <p class="button-icons__note-text">&lt;code&gt;icon&lt;/code&gt; elige el icono y &lt;code&gt;iconPosition&lt;/code&gt; lo coloca al inicio, al final o arriba. &lt;code&gt;showLabel&lt;/code&gt; oculta el texto visible y lo deja en el botón.</p>
        </div>

    </div>

</div>

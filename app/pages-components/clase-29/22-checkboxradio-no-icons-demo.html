<div class="main__demo">

    <div class="checkboxradio-no-icons">

        <h3 class="checkboxradio-no-icons__title">Sin iconos</h3>

        <p class="checkboxradio-no-icons__hint">&lt;code&gt;icon: false&lt;/code&gt; deja el botón sin el icono de marcado.</p>

        <div class="checkboxradio-no-icons__stage">
            <fieldset>
            <legend>Ubicación</legend>
            <label for="nueva-york">Nueva York</label>
            <input type="radio" name="lugar" id="nueva-york" value="Nueva York" checked>
            <label for="paris">París</label>
            <input type="radio" name="lugar" id="paris" value="París">
            <label for="londres">Londres</label>
            <input type="radio" name="lugar" id="londres" value="Londres">
            </fieldset>
        </div>

        <div class="checkboxradio-no-icons__note">
            <p class="checkboxradio-no-icons__note-text">&lt;code&gt;icon: false&lt;/code&gt; deja el botón sin el icono de marcado.</p>
        </div>

    </div>

</div>

<div class="main__demo">

    <div class="autocomplete-remote-jsonp">

        <h3 class="autocomplete-remote-jsonp__title">Origen remoto JSONP</h3>

        <p class="autocomplete-remote-jsonp__hint">Hacen falta dos letras.</p>

        <div class="autocomplete-remote-jsonp__stage">

            <p id="estado" class="nota">Escribe al menos dos letras.</p>

        <div class="autocomplete-remote-jsonp__note">
            <p class="autocomplete-remote-jsonp__note-text">Hacen falta dos letras. Escribe &lt;code&gt;mad&lt;/code&gt;. El aviso pasa a «Pidiendo datos…» y, al cabo de un momento, sale Madrid.</p>

    </div>

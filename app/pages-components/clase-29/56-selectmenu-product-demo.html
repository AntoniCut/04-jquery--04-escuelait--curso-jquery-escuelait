<div class="main__demo">

    <div class="selectmenu-product">

        <h3 class="selectmenu-product__title">Selección de producto</h3>

        <p class="selectmenu-product__hint">Los menús cambian el radio y el color del círculo.</p>

        <div class="selectmenu-product__stage">
            <div id="circulo"></div>
            <fieldset class="controles">
            <label for="radio">Radio del círculo</label>
            <select id="radio">
            <option value="50px">50px</option>
            <option value="100px">100px</option>
            <option value="150px" selected>150px</option>
            <option value="200px">200px</option>
            <option value="250px">250px</option>
            </select>
            
            <label for="color">Color del círculo</label>
            <select id="color">
            <option value="black">Negro</option>
            <option value="red">Rojo</option>
            <option value="yellow" selected>Amarillo</option>
            <option value="blue">Azul</option>
            <option value="green">Verde</option>
            </select>
            </fieldset>
        </div>

        <div class="selectmenu-product__note">
            <p class="selectmenu-product__note-text">Los menús cambian el radio y el color del círculo.</p>
        </div>

    </div>

</div>

<div class="main__demo">

    <div class="checkboxradio-product">

        <h3 class="checkboxradio-product__title">Selector de producto</h3>

        <p class="checkboxradio-product__hint">Elige marca y forma con los radios.</p>

        <div class="checkboxradio-product__stage">
            <div class="controls">
            <div class="brand-wrap">
            <h2>1.) Select a brand</h2>
            <div class="brand">
            <label for="brand-jquery">jQuery</label>
            <input type="radio" name="brand" id="brand-jquery" data-background-color="#0769AD" data-color="#7ACEF4" data-background-image="url(../../../assets/img/clase-29/jquery.png)">
            <label for="brand-jquery-ui">jQuery UI</label>
            <input type="radio" name="brand" id="brand-jquery-ui" data-background-color="#B24926" data-color="#FAA523" data-background-image="url(../../../assets/img/clase-29/jquery-ui.png)" checked>
            <label for="brand-jquery-mobile">jQuery Mobile</label>
            <input type="radio" name="brand" id="brand-jquery-mobile" data-background-color="#108040" data-color="#3EB249" data-background-image="url(../../../assets/img/clase-29/jquery-mobile.png)">
            <label for="brand-sizzle">Sizzle</label>
            <input type="radio" name="brand" id="brand-sizzle" data-background-color="#9A1B1E" data-color="#FAA523" data-background-image="url(../../../assets/img/clase-29/sizzle.png)">
            <label for="brand-qunit">QUnit</label>
            <input type="radio" name="brand" id="brand-qunit" data-background-color="#390F39" data-color="#9C3493" data-background-image="url(../../../assets/img/clase-29/qunit.png)">
            </div>
            </div>
            <div class="shape-wrap">
            <h2>2.) Select a shape</h2>
            <div class="shape-bar">
            <label for="shape-circle">Circle</label>
            <input type="radio" name="shape" id="shape-circle" value="circle" checked>
            <label for="shape-square">Square</label>
            <input type="radio" name="shape" id="shape-square" value="square">
            <label for="shape-pill">Pill</label>
            <input type="radio" name="shape" id="shape-pill" value="pill">
            <label for="shape-rectangle">Rectangle</label>
            <input type="radio" name="shape" id="shape-rectangle" value="rectangle">
            </div>
            </div>
            <div class="toggle-wrap">
            <h2>3.) Customize</h2>
            <div class="toggles">
            <label for="color">Shadow</label>
            <input class="toggle brand-toggle" type="checkbox" name="color" id="color">
            <label for="border">Border</label>
            <input class="toggle" type="checkbox" name="border" id="border">
            <label for="background-color">Background</label>
            <input class="toggle brand-toggle" type="checkbox" name="background-color" id="background-color" checked>
            <label for="background-image">Background Image</label>
            <input class="toggle brand-toggle" type="checkbox" name="background-image" id="background-image" checked>
            </div>
            </div>
            <div class="shape circle"></div>
            </div>
        </div>

        <div class="checkboxradio-product__note">
            <p class="checkboxradio-product__note-text">Elige marca y forma con los radios. Las casillas activan la sombra, el borde, el fondo y el logo. El recuadro de la derecha muestra la combinación.</p>
        </div>

    </div>

</div>

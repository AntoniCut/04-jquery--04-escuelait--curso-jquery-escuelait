<div class="main__demo">

    <div class="drag-sort">

        <h3 class="drag-sort__title">Draggable y Sortable</h3>

        <p class="drag-sort__hint">Un elemento draggable puede soltarse dentro de una lista sortable y pasar a formar parte de ella.</p>

        <div class="drag-sort__stage">
                    <ul class="drag-sort__list">
                        <li id="draggable" class="drag-sort__item ui-state-highlight">Arrástrame hacia abajo</li>
                    </ul>
                    <ul id="sortable" class="drag-sort__list">
                    <li class="drag-sort__item ui-state-default">Elemento 1</li>
                    <li class="drag-sort__item ui-state-default">Elemento 2</li>
                    <li class="drag-sort__item ui-state-default">Elemento 3</li>
                    <li class="drag-sort__item ui-state-default">Elemento 4</li>
                    <li class="drag-sort__item ui-state-default">Elemento 5</li>
                    </ul>
        </div>

        <div class="drag-sort__note">
            <p class="drag-sort__note-text">Arrastrar la pieza resaltada hasta la lista de abajo.</p>
        </div>

    </div>

</div>

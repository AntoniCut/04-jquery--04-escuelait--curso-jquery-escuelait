<div class="main__demo">

    <div class="drop-default">

        <h3 class="drop-default__title">Funcionalidad por defecto</h3>

        <p class="drop-default__hint">Cualquier elemento del DOM puede ser un destino de elementos arrastrables. Al soltar encima se dispara drop.</p>

        <div class="drop-default__stage">
                    <div id="draggable" class="drop-default__drag ui-widget-content">
                        <p>Arrástrame hasta el destino</p>
                    </div>
                    <div id="droppable" class="drop-default__drop ui-widget-header">
                        <p>Suelta aquí</p>
                    </div>
        </div>

        <div class="drop-default__note">
            <p class="drop-default__note-text">Soltar la caja en el destino y ver el aviso.</p>
        </div>

    </div>

</div>

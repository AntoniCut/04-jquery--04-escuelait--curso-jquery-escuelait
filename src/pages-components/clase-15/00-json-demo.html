<div class="main__demo">

    <article class="json-bebidas">

        <header class="json-bebidas__header">
            <h2 class="json-bebidas__title">
                Bebida
                <span id="bebida" class="json-bebidas__name">
                    <!--  inyectar contenido con jQuery  -->
                </span>
            </h2>
            <p class="json-bebidas__meta">
                <span class="json-bebidas__meta-label">Inicio de produccion</span>
                <span id="inicio" class="json-bebidas__meta-value">
                    <!--  inyectar contenido con jQuery  -->
                </span>
            </p>
        </header>

        <section class="json-bebidas__block" aria-labelledby="ingredientes-title">
            <h3 id="ingredientes-title" class="json-bebidas__subtitle">
                Ingredientes
            </h3>
            <ul id="ingredientes" class="json-bebidas__list">
                <!--  inyectar contenido con jQuery  -->
            </ul>
        </section>

        <section class="json-bebidas__block" aria-labelledby="marcas-title">
            <h3 id="marcas-title" class="json-bebidas__subtitle">
                Marcas
            </h3>
            <div class="json-bebidas__table-wrap">
                <table class="json-bebidas__table">
                    <thead>
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Tipo</th>
                            <th scope="col">Procedencia</th>
                        </tr>
                    </thead>
                    <tbody id="tablaMarcas">
                        <!--  inyectar contenido con jQuery  -->
                    </tbody>
                </table>
            </div>
        </section>

    </article>

</div>

        <div class="resize-ratio__stage">
                    <div id="resizable" class="resize-ratio__box ui-widget-content">

        </div>

        <div class="resize-ratio__note">
            <p class="resize-ratio__note-text">Estirar un solo borde y ver que el otro lado acompaña.</p>
        </div>

    </div>

</div>

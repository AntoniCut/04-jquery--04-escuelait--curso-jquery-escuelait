<div class="main__demo">

    <div class="resize-sync">

        <h3 class="resize-sync__title">Cambio de tamaño simultáneo</h3>

        <p class="resize-sync__hint">alsoResize cambia el tamaño de otros elementos a la vez. Se le pasa un selector compartido.</p>

        <div class="resize-sync__stage">
                    <div id="resizable" class="resize-sync__box ui-widget-header">
                        <h3 class="resize-sync__heading ui-state-active">Redimensiona</h3>
                    </div>
                    <div id="also" class="resize-sync__box resize-sync__box--second ui-widget-content">
                        <h3 class="resize-sync__heading ui-widget-header">esta también</h3>
                    </div>
        </div>

        <div class="resize-sync__note">
            <p class="resize-sync__note-text">Estirar la primera caja y ver que la segunda la sigue.</p>
        </div>

    </div>

</div>

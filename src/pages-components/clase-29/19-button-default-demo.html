<div class="main__demo">

    <div class="button-default">

        <h3 class="button-default__title">Funcionalidad por defecto</h3>

        <p class="button-default__hint">El primer grupo usa el widget.</p>

        <div class="button-default__stage">
            <section class="widget">
            <h2>Con el widget</h2>
            <button type="button">Un botón</button>
            <input type="submit" value="Enviar">
            <a href="#boton">Un enlace</a>
            </section>
            <section>
            <h2>Solo con CSS</h2>
            <button type="button" class="ui-button ui-corner-all">Un botón</button>
            <input type="submit" class="ui-button ui-corner-all" value="Enviar">
            <a class="ui-button ui-corner-all" href="#boton">Un enlace</a>
            </section>
        </div>

        <div class="button-default__note">
            <p class="button-default__note-text">El primer grupo usa el widget. El segundo solo lleva las clases, sin JavaScript. Los clics no salen de la página.</p>
        </div>

    </div>

</div>

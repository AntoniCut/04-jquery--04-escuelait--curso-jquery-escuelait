<div class="main__demo">

    <div class="tooltip-forms">

        <h3 class="tooltip-forms__title">Formularios</h3>

        <p class="tooltip-forms__hint">Cada campo explica, en su ayuda, qué dato se espera.</p>

        <div class="tooltip-forms__stage">
            <form id="perfil">
            <p class="campo">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" title="Nombre y apellidos">
            </p>
            <p class="campo">
            <label for="edad">Edad</label>
            <input id="edad" type="number" title="Edad en años">
            </p>
            <p class="campo">
            <label for="ciudad">Ciudad</label>
            <input id="ciudad" type="text" title="Ciudad de residencia">
            </p>
            <button type="submit">Guardar</button>
            </form>
            <p id="resultado" class="nota"></p>
        </div>

        <div class="tooltip-forms__note">
            <p class="tooltip-forms__note-text">Cada campo explica, en su ayuda, qué dato se espera.</p>
        </div>

    </div>

</div>

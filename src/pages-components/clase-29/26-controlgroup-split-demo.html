<div class="main__demo">

    <div class="controlgroup-split">

        <h3 class="controlgroup-split__title">Botón dividido</h3>

        <p class="controlgroup-split__hint">El botón ejecuta la acción visible.</p>

        <div class="controlgroup-split__stage">
            <div id="dividido">
            <button type="button" id="ejecutar">Ejecutar</button>
            <select id="accion">
            <option>Ejecutar</option>
            <option>Guardar</option>
            <option>Cancelar</option>
            </select>
            </div>
            <p id="resultado" class="nota">Todavía no hay una acción.</p>
        </div>

        <div class="controlgroup-split__note">
            <p class="controlgroup-split__note-text">El botón ejecuta la acción visible. El menú de al lado cambia esa acción.</p>
        </div>

    </div>

</div>

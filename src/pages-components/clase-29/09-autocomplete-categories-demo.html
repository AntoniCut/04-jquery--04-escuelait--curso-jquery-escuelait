<div class="main__demo">

    <div class="autocomplete-categories">

        <h3 class="autocomplete-categories__title">Categorías</h3>

        <p class="autocomplete-categories__hint">Escribe en el campo.</p>

        <div class="autocomplete-categories__stage">
            <p class="campo">
            <label for="buscar">Buscar</label>
            <input id="buscar" type="text" autocomplete="off">
            </p>
        </div>

        <div class="autocomplete-categories__note">
            <p class="autocomplete-categories__note-text">Cada elemento se escribe con &lt;code&gt;label&lt;/code&gt; y &lt;code&gt;category&lt;/code&gt;. Los de la misma categoría van juntos en el array para que la cabecera salga una sola vez.</p>
        </div>

    </div>

</div>

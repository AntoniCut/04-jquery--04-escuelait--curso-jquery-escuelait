<div class="main__demo">

    <div class="selectmenu-default">

            </select>
            </p>
            <p class="campo">
            <label for="archivo">Archivo</label>
            <select id="archivo">

            <option>jquery.js</option>
            <option>jquery-ui.js</option>
            </optgroup>
            <optgroup label="Otros">
            <option>notas.txt</option>

            </select>
            </p>
            <p class="campo">

            <option>13</option>

            <option>15</option>
            <option>16</option>
            <option>17</option>
            <option>18</option>
            <option>19</option>
            </select>
            </p>
            <p class="campo">
            <label for="trato">Trato</label>
            <select id="trato">
            <option value="">Elige uno</option>
            <option>Sr.</option>
            <option>Sra.</option>
            <option>Dr.</option>
            <option>Dra.</option>
            </select>
            </p>
        </div>

        <div class="selectmenu-default__note">
            <p class="selectmenu-default__note-text">Hay un select simple, otro con grupos, una lista larga con desplazamiento y uno con un valor vacío.</p>
        </div>

    </div>

</div>

<div class="main__demo">

    <div class="progressbar-indeterminate">

        <h3 class="progressbar-indeterminate__title">Valor indeterminado</h3>

        <p class="progressbar-indeterminate__hint">La barra empieza en carga.</p>

        <div class="progressbar-indeterminate__stage">
            <div id="progressbar"></div>
            <div class="acciones">
            <button type="button" id="valor-aleatorio">Valor aleatorio, determinado</button>
            <button type="button" id="indeterminado">Indeterminado</button>
            <button type="button" id="color-aleatorio">Color aleatorio</button>
            </div>
        </div>

        <div class="progressbar-indeterminate__note">
            <p class="progressbar-indeterminate__note-text">La barra empieza en carga. Los botones fijan un valor, vuelven a la carga o cambian el color del avance.</p>
        </div>

    </div>

</div>

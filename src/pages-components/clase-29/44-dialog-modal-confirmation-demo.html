<div class="main__demo">

    <div class="dialog-modal-confirmation">

        <h3 class="dialog-modal-confirmation__title">Confirmación modal</h3>

        <p class="dialog-modal-confirmation__hint">La ventana bloquea el resto de la página hasta que se elimina el elemento o se cancela.</p>

        <div class="dialog-modal-confirmation__stage">
            <button type="button" id="borrar">Eliminar elemento</button>
            <p id="resultado" class="nota">El elemento sigue en la lista.</p>
            <div id="dialog" title="Confirmar">
            <p>¿Eliminar este elemento? Esta acción no se puede deshacer.</p>
            </div>
        </div>

        <div class="dialog-modal-confirmation__note">
            <p class="dialog-modal-confirmation__note-text">La ventana bloquea el resto de la página hasta que se elimina el elemento o se cancela.</p>
        </div>

    </div>

</div>

<div class="main__demo">

    <div class="slider-select">

        <h3 class="slider-select__title">Unido a un select</h3>

        <p class="slider-select__hint">El deslizador y el select muestran el mismo número.</p>

        <div class="slider-select__stage">
            <p class="campo">
            <label for="camas">Camas</label>
            <select id="camas">
            <option>1</option>
            <option>2</option>
            <option selected>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            </select>
            </p>
            <div id="slider"></div>
        </div>

        <div class="slider-select__note">
            <p class="slider-select__note-text">El deslizador y el select muestran el mismo número. Cambiar uno actualiza el otro.</p>
        </div>

    </div>

</div>

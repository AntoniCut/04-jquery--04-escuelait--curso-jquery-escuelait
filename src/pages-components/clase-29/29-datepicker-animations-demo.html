<div class="main__demo">

    <div class="datepicker-animations">

        <h3 class="datepicker-animations__title">Animaciones</h3>

        <p class="datepicker-animations__hint">Cada campo abre el calendario con una animación distinta: fundido, deslizamiento, persiana y pliegue.</p>

        <div class="datepicker-animations__stage">
            <p class="campo">
            <label for="fundido">Fundido</label>
            <input id="fundido" type="text" autocomplete="off">
            </p>
            <p class="campo">
            <label for="deslizar">Deslizar</label>
            <input id="deslizar" type="text" autocomplete="off">
            </p>
            <p class="campo">
            <label for="persiana">Persiana</label>
            <input id="persiana" type="text" autocomplete="off">
            </p>
            <p class="campo">
            <label for="pliegue">Pliegue</label>
            <input id="pliegue" type="text" autocomplete="off">
            </p>
        </div>

        <div class="datepicker-animations__note">
            <p class="datepicker-animations__note-text">Cada campo abre el calendario con una animación distinta: fundido, deslizamiento, persiana y pliegue.</p>
        </div>

    </div>

</div>

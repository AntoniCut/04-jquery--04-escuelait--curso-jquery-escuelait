<div class="main__demo">

    <div class="checkboxradio-radio">

        <h3 class="checkboxradio-radio__title">Grupo de radios</h3>

        <p class="checkboxradio-radio__hint">Un solo grupo de radios.</p>

        <div class="checkboxradio-radio__stage">
            <fieldset>
            <legend>Ubicación</legend>
            <label for="nueva-york">Nueva York</label>
            <input type="radio" name="lugar" id="nueva-york" value="Nueva York" checked>
            <label for="paris">París</label>
            <input type="radio" name="lugar" id="paris" value="París">
            <label for="londres">Londres</label>
            <input type="radio" name="lugar" id="londres" value="Londres">
            </fieldset>
            <p id="resultado" class="nota">Ubicación: Nueva York.</p>
        </div>

        <div class="checkboxradio-radio__note">
            <p class="checkboxradio-radio__note-text">Un solo grupo de radios. La ubicación elegida se escribe debajo.</p>
        </div>

    </div>

</div>

<div class="main__demo">

    <div class="spinner-default">

        <h3 class="spinner-default__title">Funcionalidad por defecto</h3>

        <p class="spinner-default__hint">Los botones desactivan el control, lo quitan y lo vuelven a crear, leen el valor y lo fijan en 5.</p>

        <div class="spinner-default__stage">
            <p class="campo">
            <label for="spinner">Valor</label>
            <input id="spinner" name="valor" value="0">
            </p>
            <div class="acciones">
            <button type="button" id="alternar">Activar o desactivar</button>
            <button type="button" id="widget">Quitar o crear</button>
            <button type="button" id="leer">Leer valor</button>
            <button type="button" id="fijar">Fijar en 5</button>
            </div>
            <p id="resultado" class="nota">Pulsa Leer valor.</p>
        </div>

        <div class="spinner-default__note">
            <p class="spinner-default__note-text">Los botones desactivan el control, lo quitan y lo vuelven a crear, leen el valor y lo fijan en 5. El valor se escribe en la página.</p>
        </div>

    </div>

</div>

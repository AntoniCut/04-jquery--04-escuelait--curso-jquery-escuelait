<div class="main__demo">

    <div class="tooltip-player">

        <h3 class="tooltip-player__title">Reproductor</h3>

        <p class="tooltip-player__hint">Un reproductor falso, con botones de me gusta, compartir y aviso.</p>

        <div class="tooltip-player__stage">
            <div class="pantalla">Aquí va el vídeo (¿HTML5?)</div>
            <div class="herramientas">
            <span class="grupo">
            <button type="button" data-icon="ui-icon-circle-arrow-n" title="Esto me gusta">Me gusta</button>
            <button type="button" data-icon="ui-icon-circle-arrow-s">Esto no me gusta</button>
            </span>
            <div class="grupo">
            <button type="button" data-icon="ui-icon-circle-plus" title="Añadir para ver más tarde">Añadir</button>
            <button type="button" class="menu" data-icon="ui-icon-triangle-1-s">Añadir a favoritos o a una lista</button>
            <ul id="listas">
            <li>
            <div>Favoritos</div>
            </li>
            <li>
            <div>Graciosos</div>
            </li>
            <li></li>
            <li>
            <div>Nueva lista…</div>
            </li>
            </ul>
            </div>
            <button type="button" title="Compartir este vídeo">Compartir</button>
            <button type="button" data-icon="ui-icon-alert">Marcar como inapropiado</button>
            </div>
        </div>

        <div class="tooltip-player__note">
            <p class="tooltip-player__note-text">Un reproductor falso, con botones de me gusta, compartir y aviso. La ayuda de cada botón usa un estilo propio.</p>
        </div>

    </div>

</div>

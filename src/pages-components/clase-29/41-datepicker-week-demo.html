<div class="main__demo">

    <div class="datepicker-week">

        <h3 class="datepicker-week__title">Semana del año</h3>

        <p class="datepicker-week__hint">&lt;code&gt;showWeek&lt;/code&gt; añade la columna con el número de semana.</p>

        <div class="datepicker-week__stage">
            <p class="campo">
            <label for="datepicker">Fecha</label>
            <input id="datepicker" type="text" autocomplete="off">
            </p>
        </div>

        <div class="datepicker-week__note">
            <p class="datepicker-week__note-text">&lt;code&gt;showWeek&lt;/code&gt; añade la columna con el número de semana. La semana empieza en lunes.</p>
        </div>

    </div>

</div>

<div class="main__demo">

    <div class="spinner-time">

        <h3 class="spinner-time__title">Hora</h3>

        <p class="spinner-time__hint">Los minutos van de 0 a 59.</p>

        <div class="spinner-time__stage">
            <p class="campo">
            <label for="horas">Horas</label>
            <input id="horas" value="9">
            <label for="minutos">Minutos</label>
            <input id="minutos" value="30">
            </p>
        </div>

        <div class="spinner-time__note">
            <p class="spinner-time__note-text">Los minutos van de 0 a 59. Al pasar de 59 avanzan una hora, y al bajar de 0 retroceden una hora.</p>
        </div>

    </div>

</div>

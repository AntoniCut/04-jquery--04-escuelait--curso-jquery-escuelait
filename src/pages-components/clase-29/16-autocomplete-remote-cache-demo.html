<div class="main__demo">

    <div class="autocomplete-remote-cache">

        <h3 class="autocomplete-remote-cache__title">Origen remoto con caché</h3>

        <p class="autocomplete-remote-cache__hint">Hacen falta dos letras.</p>

        <div class="autocomplete-remote-cache__stage">
            <p class="campo">
            <label for="ciudad">Ciudad</label>
            <input id="ciudad" type="text" autocomplete="off">
            </p>
            <p id="estado" class="nota">Escribe al menos dos letras.</p>
        </div>

        <div class="autocomplete-remote-cache__note">
            <p class="autocomplete-remote-cache__note-text">Hacen falta dos letras. Escribe &lt;code&gt;vi&lt;/code&gt;: la primera vez espera y guarda el resultado. Borra el campo y vuelve a escribir &lt;code&gt;vi&lt;/code&gt;. El aviso dice que la lista sale de la caché.</p>
        </div>

    </div>

</div>

<div class="main__demo">

    <div class="autocomplete-remote">

        <h3 class="autocomplete-remote__title">Origen remoto</h3>

        <p class="autocomplete-remote__hint">Hacen falta dos letras.</p>

        <div class="autocomplete-remote__stage">
            <p class="campo">
            <label for="ciudad">Ciudad</label>
            <input id="ciudad" type="text" autocomplete="off">
            </p>
            <p id="estado" class="nota">Escribe al menos dos letras.</p>
        </div>

        <div class="autocomplete-remote__note">
            <p class="autocomplete-remote__note-text">Hacen falta dos letras. Escribe &lt;code&gt;mad&lt;/code&gt; y, tras un momento, sale Madrid. Con &lt;code&gt;va&lt;/code&gt; salen Valencia y Valladolid.</p>
        </div>

    </div>

</div>

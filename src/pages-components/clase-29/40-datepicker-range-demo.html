<div class="main__demo">

    <div class="datepicker-range">

        <h3 class="datepicker-range__title">Elegir un rango</h3>

        <p class="datepicker-range__hint">La fecha de inicio impide elegir un final anterior.</p>

        <div class="datepicker-range__stage">
            <p class="campo">
            <label for="desde">Desde</label>
            <input id="desde" type="text" autocomplete="off">
            </p>
            <p class="campo">
            <label for="hasta">Hasta</label>
            <input id="hasta" type="text" autocomplete="off">
            </p>
        </div>

        <div class="datepicker-range__note">
            <p class="datepicker-range__note-text">La fecha de inicio impide elegir un final anterior. La fecha final impide elegir un inicio posterior.</p>
        </div>

    </div>

</div>

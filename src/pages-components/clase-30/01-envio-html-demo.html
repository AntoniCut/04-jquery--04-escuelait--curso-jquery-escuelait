<div class="main__demo">

    <div class="smartform">

        <h3 class="smartform__title">
            Envío en texto
        </h3>

        <p class="smartform__hint">
            Sin opciones. La respuesta de texto se escribe en el mensaje.
        </p>

        <form
            class="smartform__form"
            id="contacto"
            action="/escuelait/curso-jquery-escuelait/app/services/clase-30/guardar.php"
            method="post"
        >

            <section class="smartform__fields">

                <h2 class="smartform__fields-title">Contacto</h2>

                <label class="smartform__field">
                    Nombre
                    <input class="smartform__input" type="text" name="nombre" autocomplete="name">
                </label>

                <label class="smartform__field">
                    Email
                    <input class="smartform__input" type="text" name="email" autocomplete="email" inputmode="email">
                </label>

                <label class="smartform__field">
                    Teléfono
                    <input class="smartform__input" type="text" name="telefono" autocomplete="tel" inputmode="tel">
                </label>

                <label class="smartform__field">
                    Dirección
                    <input class="smartform__input" type="text" name="direccion" autocomplete="street-address">
                </label>

                <button class="smartform__submit" type="submit">Guardar</button>

            </section>

            <section class="smartform__message" id="mensaje">
                <p class="smartform__message-text">Actualización de contactos</p>
            </section>

        </form>

    </div>

</div>
